<text x="84" y="640" font-family="DejaVu Serif, Georgia, serif" font-size="76" font-weight="bold" fill="#FFFFFF">to long-term.</text>
<text x="84" y="735" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#D9D2D9"><tspan fill="#FFBC7D" font-weight="bold">Bridge up to $20M</tspan> &#183; short-term</text>
