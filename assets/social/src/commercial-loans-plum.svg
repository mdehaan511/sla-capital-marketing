<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<!-- Variant A: plum background. Rotate variants across posts: plum / orange / light. -->
<!-- Social quote card: commercial real estate loans launch (/commercial/). Drafted 2026-11-23 for 2026-11-24. No rates, LTV or seasoning baked in (commercial is priced case by case, nothing published). Loan-size caps match the /commercial/ page: bridge up to $20,000,000, DSCR up to $3,000,000. New filename. -->
<rect width="1080" height="1080" fill="#281D28"/>
<rect x="84" y="84" width="10" height="120" fill="#DA7238"/>
<rect x="104" y="84" width="10" height="120" fill="#DA7238"/>
<text x="140" y="150" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">SLA <tspan fill="#DA7238">Capital</tspan></text>
<text x="140" y="192" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#B8AFB8">Private lending for real estate investors</text>
<text x="84" y="340" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" letter-spacing="4" fill="#FFBC7D">Now offering: commercial</text>
<text x="84" y="440" font-family="DejaVu Serif, Georgia, serif" font-size="76" font-weight="bold" fill="#FFFFFF">Commercial deals,</text>
