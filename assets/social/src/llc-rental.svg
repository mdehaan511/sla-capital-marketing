<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<!-- Variant C: light background. Rotate variants across posts: plum / orange / light. -->
<!-- Social quote card: buying rental property in an LLC (blog/llc-rental-property-loans). -->
<rect width="1080" height="1080" fill="#F5F2EF"/>
<rect x="84" y="84" width="10" height="120" fill="#DA7238"/>
<rect x="104" y="84" width="10" height="120" fill="#DA7238"/>
<text x="140" y="150" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#281D28">SLA <tspan fill="#DA7238">Capital</tspan></text>
<text x="140" y="192" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#6b6470">Private lending for real estate investors</text>
<text x="84" y="340" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" letter-spacing="4" fill="#DA7238">Entity lending</text>
<text x="84" y="445" font-family="DejaVu Serif, Georgia, serif" font-size="84" font-weight="bold" fill="#281D28">Your bank won&#8217;t</text>
<text x="84" y="545" font-family="DejaVu Serif, Georgia, serif" font-size="84" font-weight="bold" fill="#281D28">lend to an LLC.</text>
<text x="84" y="645" font-family="DejaVu Serif, Georgia, serif" font-size="84" font-weight="bold" fill="#281D28">We start there.</text>
<text x="84" y="735" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#443A44">Title in the entity from <tspan fill="#DA7238" font-weight="bold">day one</tspan></text>
<text x="84" y="793" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#443A44">Same pricing as <tspan fill="#DA7238" font-weight="bold">an individual</tspan></text>
<text x="84" y="851" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#443A44"><tspan fill="#DA7238" font-weight="bold">2&#8211;10 properties</tspan> on a single loan</text>
<text x="84" y="922" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#9A929A">Members sign a personal guaranty. Business-purpose loans only.</text>
<text x="84" y="1020" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#9A929A">slacapital.ai &#183; NMLS #2863552</text>
</svg>
