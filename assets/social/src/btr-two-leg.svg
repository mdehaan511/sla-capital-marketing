<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<!-- Variant B: orange background. Rotate variants across posts: plum / orange / light. -->
<!-- Social quote card: build-to-rent two-loan relay (blog/build-to-rent-financing). -->
<!-- SEASONING-BEARING CARD (states "no seasoning period" on the DSCR refi leg, per the 9/18/26 program). No rates baked in.
     Construction terms from data/rates.json: 85% land + 85% construction, 18 or 24 months. -->
<rect width="1080" height="1080" fill="#DA7238"/>
<rect x="84" y="84" width="10" height="120" fill="#281D28"/>
<rect x="104" y="84" width="10" height="120" fill="#281D28"/>
<text x="140" y="150" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#281D28">SLA <tspan fill="#FFFFFF">Capital</tspan></text>
<text x="140" y="192" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#4A2A15">Private lending for real estate investors</text>
<text x="84" y="340" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" letter-spacing="4" fill="#281D28">Build-to-rent</text>
<text x="84" y="445" font-family="DejaVu Serif, Georgia, serif" font-size="80" font-weight="bold" fill="#FFFFFF">Build it.</text>
<text x="84" y="540" font-family="DejaVu Serif, Georgia, serif" font-size="80" font-weight="bold" fill="#281D28">Rent it.</text>
<text x="84" y="635" font-family="DejaVu Serif, Georgia, serif" font-size="80" font-weight="bold" fill="#FFFFFF">Refinance it.</text>
<text x="84" y="730" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#281D28">Leg 1 &#183; the construction loan</text>
<text x="84" y="774" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#3D2113">85% of land + 85% of the build, 18 or 24 months</text>
<text x="84" y="838" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#281D28">Leg 2 &#183; the 30-year DSCR refinance</text>
<text x="84" y="882" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#3D2113">Market rent qualifies &#183; no lease &#183; no seasoning</text>
<text x="84" y="1020" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#5C3A22">slacapital.ai &#183; NMLS #2863552</text>
</svg>
