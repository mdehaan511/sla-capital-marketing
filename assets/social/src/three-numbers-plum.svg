<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<!-- Variant A: plum background. Rotate variants across posts: plum / orange / light. -->
<!-- Social quote card: LTV vs LTC vs ARV, the three numbers that size every investor loan (blog/ltv-ltc-arv-explained). Drafted 2026-11-02 for 2026-11-03. No rates baked in; LTC is the advertised 92.5%. -->
<rect width="1080" height="1080" fill="#281D28"/>
<rect x="84" y="84" width="10" height="120" fill="#DA7238"/>
<rect x="104" y="84" width="10" height="120" fill="#DA7238"/>
<text x="140" y="150" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">SLA <tspan fill="#DA7238">Capital</tspan></text>
<text x="140" y="192" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#B8AFB8">Private lending for real estate investors</text>
<text x="84" y="340" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" letter-spacing="4" fill="#FFBC7D">LTV &#183; LTC &#183; ARV</text>
<text x="84" y="445" font-family="DejaVu Serif, Georgia, serif" font-size="84" font-weight="bold" fill="#FFFFFF">Three numbers.</text>
<text x="84" y="545" font-family="DejaVu Serif, Georgia, serif" font-size="84" font-weight="bold" fill="#FFFFFF">One rule.</text>
<text x="84" y="645" font-family="DejaVu Serif, Georgia, serif" font-size="84" font-weight="bold" fill="#FFFFFF">The lowest wins.</text>
<text x="84" y="735" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#D9D2D9"><tspan fill="#FFBC7D" font-weight="bold">LTV</tspan> finances the hold &#183; to 80%</text>
<text x="84" y="793" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#D9D2D9"><tspan fill="#FFBC7D" font-weight="bold">LTC</tspan> funds the work &#183; up to 92.5%</text>
<text x="84" y="851" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#D9D2D9"><tspan fill="#FFBC7D" font-weight="bold">ARV</tspan> caps the loan &#183; 65&#8211;75%</text>
<text x="84" y="922" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#8F858F">Leverage depends on experience, credit, and the deal.</text>
<text x="84" y="1020" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#8F858F">slacapital.ai &#183; NMLS #2863552</text>
</svg>
