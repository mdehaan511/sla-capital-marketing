<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<!-- Variant B: orange background. Rotate variants across posts: plum / orange / light. -->
<!-- Social quote card: DSCR vs conventional mortgage (blog/dscr-vs-conventional-mortgage). -->
<rect width="1080" height="1080" fill="#DA7238"/>
<rect x="84" y="84" width="10" height="120" fill="#281D28"/>
<rect x="104" y="84" width="10" height="120" fill="#281D28"/>
<text x="140" y="150" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#281D28">SLA <tspan fill="#FFFFFF">Capital</tspan></text>
<text x="140" y="192" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#4A2A15">Private lending for real estate investors</text>
<text x="84" y="380" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" letter-spacing="4" fill="#281D28">DSCR vs conventional</text>
<text x="84" y="490" font-family="DejaVu Serif, Georgia, serif" font-size="72" font-weight="bold" fill="#FFFFFF">Conventional asks</text>
<text x="84" y="575" font-family="DejaVu Serif, Georgia, serif" font-size="72" font-weight="bold" fill="#FFFFFF">what you make.</text>
<text x="84" y="680" font-family="DejaVu Serif, Georgia, serif" font-size="72" font-weight="bold" fill="#281D28">DSCR asks what</text>
<text x="84" y="765" font-family="DejaVu Serif, Georgia, serif" font-size="72" font-weight="bold" fill="#281D28">the house makes.</text>
<text x="84" y="850" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#3D2113">30-year fixed from 5.95% &#183; no income documents</text>
<text x="84" y="898" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#3D2113">No 10-property cap &#183; title in your LLC</text>
<text x="84" y="1020" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#5C3A22">slacapital.ai &#183; NMLS #2863552</text>
</svg>
